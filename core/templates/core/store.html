{% extends 'core/base.html' %}

{% block title %}
Store - GameStore
{% endblock %}

{% block content %}

<main class="store-page">

    <h1>Game Store 🎮</h1>

    <div class="game-grid">

        {% for game in games %}

            <div class="game-card">

                {% if game.cover %}
                    <img src="{{ game.cover.url }}" alt="{{ game.title }}">
                {% endif %}

                <div class="game-card-content">

                    <h2>{{ game.title }}</h2>

                    <p>{{ game.description }}</p>

                    <div class="game-card-bottom">

                    <a href="{% url 'game_detail' game.id %}">
                        View Game
                    </a>

                    </div>

                </div>

            </div>

        {% endfor %}

    </div>

</main>

{% endblock %}
