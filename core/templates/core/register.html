{% extends 'core/base.html' %}

{% block title %}
Register - GameStore
{% endblock %}

{% block content %}

<main class="login-page">

    <div class="login-box">

        <h1>Create Account</h1>

        {% if error %}
            <p class="login-error">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >


            <label for="password_confirm">
                Confirm Password
            </label>

            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>

    </div>

</main>

{% endblock %}
