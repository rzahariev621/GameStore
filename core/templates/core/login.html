{% extends 'core/base.html' %}

{% block title %}
Login - GameStore
{% endblock %}

{% block content %}

<main class="login-page">

    <div class="login-box">

        <h1>Login</h1>

        {% if error %}
            <p class="login-error">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <a href="{% url 'password_reset' %}">
            Forgot Password?
        </a>

    </div>

</main>

{% endblock %}
