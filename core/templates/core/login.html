{% extends 'core/base.html' %}
{% load i18n %}

{% block title %}
{% trans "Login" %} - PlayGuide
{% endblock %}

{% block content %}

<main class="container py-5">

    <section
        class="mx-auto"
        style="max-width: 480px;"
    >

        <div class="card bg-dark text-white border-secondary shadow-sm">

            <div class="card-body p-4 p-md-5">

                <!-- HEADER -->

                <div class="text-center mb-4">

                    <h1 class="display-6 fw-bold mb-2">
                        {% trans "Login" %}
                    </h1>

                    <p class="text-secondary mb-0">
                        PlayGuide
                    </p>

                </div>


                <!-- ERROR -->

                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}


                <!-- FORM -->

                <form method="POST">

                    {% csrf_token %}


                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label fw-semibold"
                        >
                            {% trans "Username" %}
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            required
                            autocomplete="username"
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-4">

                        <label
                            for="password"
                            class="form-label fw-semibold"
                        >
                            {% trans "Password" %}
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            required
                            autocomplete="current-password"
                        >

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="btn btn-light fw-semibold w-100 py-2 mb-3"
                    >
                        {% trans "Login" %}
                    </button>

                </form>


                <!-- PASSWORD RESET -->

                <div class="text-center">

                    <a
                        href="{% url 'password_reset' %}"
                        class="text-secondary text-decoration-none"
                    >
                        {% trans "Forgot Password?" %}
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>

{% endblock %}
