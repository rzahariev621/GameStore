{% if avatar_user.profile.profile_picture %}
    <img src="{{ avatar_user.profile.profile_picture.url }}" alt="{{ avatar_user.username }}" class="rounded-circle border border-secondary" width="80" height="80" style="object-fit: cover;">
{% else %}
    <div class="rounded-circle border border-secondary d-flex align-items-center justify-content-center fw-bold fs-2" style="width: 80px; height: 80px;">{{ avatar_user.username|first|upper }}</div>
{% endif %}
