{% extends 'core/base.html' %}

{% block title %}
Reset Password - GameStore
{% endblock %}

{% block content %}

<main class="login-page">

    <div class="login-box">

        <h1>Reset Password</h1>

        <p>
            Enter the email address connected to your account.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label for="id_email">
                Email
            </label>

            {{ form.email }}

            <button type="submit">
                Send Reset Link
            </button>

        </form>

    </div>

</main>

{% endblock %}
